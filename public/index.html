<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contest Bot & Mini App</title>
<meta name="description" content="Telegram contest bot and web Mini App for creating and managing giveaways, subscriptions, and checklists.">
<meta property="og:title" content="Contest Bot & Mini App">
<meta property="og:description" content="Telegram contest bot and web Mini App for creating and managing giveaways, subscriptions, and checklists.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --blue: #2f6fed;
    --blue-dark: #1f4fc4;
    --blue-light: #eaf1ff;
    --green: #22c55e;
    --green-light: #e9fbf0;
    --text: #14213d;
    --muted: #7c8aa5;
    --bg: #ffffff;
    --border: #e7ecf5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f6f9ff 0%, #ffffff 220px);
    color: var(--text);
    padding: 20px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.2px; }
  h2 { font-size: 15px; margin: 26px 0 12px; color: var(--text); font-weight: 700; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 4px; }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(20,33,61,.03);
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 4px 14px rgba(47,111,237,.25);
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; box-shadow: none; }
  .btn.secondary {
    background: var(--blue-light);
    color: var(--blue);
    box-shadow: none;
  }
  .btn.link-btn {
    background: var(--green-light);
    color: #15803d;
    font-size: 13.5px;
    padding: 10px;
    margin-top: 10px;
    box-shadow: none;
  }

  .condition {
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 10px;
    padding: 14px;
    transition: background .2s ease, border-color .2s ease;
  }
  .condition.approved {
    background: var(--green-light);
    border-color: #bdf0cf;
  }
  .cond-top {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .mark {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: #fff;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .condition.approved .mark {
    background: var(--green);
    border-color: var(--green);
    transform: scale(1.05);
  }
  .mark svg { width: 14px; height: 14px; }
  .mark path {
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
  }
  .condition.approved .mark path {
    animation: draw-check .35s ease forwards;
  }
  @keyframes draw-check {
    to { stroke-dashoffset: 0; }
  }
  .cond-text { font-size: 14.5px; line-height: 1.4; flex: 1; }
  .cond-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--blue-light), #f2f7ff);
    color: var(--blue-dark);
    border-radius: 16px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
    animation: pop-in .3s ease;
  }
  .banner svg { width: 22px; height: 22px; flex-shrink: 0; }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .hero {
    text-align: center;
    padding: 8px 0 18px;
  }
  .hero svg { width: 64px; height: 64px; margin-bottom: 8px; }

  input, textarea, select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
    background: #fbfcff;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--blue);
    background: #fff;
  }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .muted-link { color: var(--blue); font-size: 13px; background: none; border: none; padding: 8px 0; cursor: pointer; font-weight: 600; }
  .list-item { display: flex; justify-content: space-between; align-items: center; }
  .list-item .title { font-weight: 700; font-size: 14.5px; }
  .list-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .skeleton {
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(90deg, #f0f3fa 25%, #f8fafd 37%, #f0f3fa 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 12px;
  }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  #app { max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
<div id="app"><div class="skeleton"></div><div class="skeleton"></div></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";
const params = new URLSearchParams(location.search);
const app = document.getElementById("app");

const ICONS = {
  check: `<svg viewBox="0 0 14 14"><path d="M2 7l3.5 3.5L12 3.5"/></svg>`,
  gift: `<svg viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="1.6"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18"/><path d="M12 8v12"/><path d="M12 8c-1.5-3.5-6-4-6-1.5C6 8 8.5 8 12 8Z"/><path d="M12 8c1.5-3.5 6-4 6-1.5C18 8 15.5 8 12 8Z"/></svg>`,
  party: `<svg viewBox="0 0 24 24" fill="none" stroke="#2f6fed" stroke-width="1.6"><path d="M3 21l6-14 12 12-14 2Z"/><path d="M14 4l1.5 1.5M18 3l1 2M20 7l2 1"/></svg>`,
  arrow: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg>`,
};

function notify(msg) {
  if (tg?.showAlert) {
    try { tg.showAlert(msg); return; } catch (e) {}
  }
  const oldToast = document.getElementById("toast-msg");
  if (oldToast) oldToast.remove();
  const toast = document.createElement("div");
  toast.id = "toast-msg";
  toast.className = "banner";
  toast.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,0.15);width:calc(100% - 32px);max-width:440px;";
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function openLink(url) {
  if (!url) return;
  if (tg?.openLink) tg.openLink(url);
  else window.open(url, "_blank");
}

async function api(action, { method = "GET", body, query } = {}) {
  const qs = new URLSearchParams({ action, ...(query || {}) });
  if (method === "GET") qs.set("init_data", initData);
  const url = `/api?${qs.toString()}`;
  const res = await fetch(url, {
    method,
    headers: method === "POST" ? { "Content-Type": "application/json" } : undefined,
    body: method === "POST" ? JSON.stringify({ init_data: initData, ...(body || {}) }) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "error");
  return data;
}

function render(html) { app.innerHTML = html; }

// ===== Экран участника =====
async function renderContest(ref) {
  render(`<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`);
  let data;
  try { data = await api("contest", { query: { ref } }); }
  catch (e) {
    render(`
      <div class="card">
        <h1>Конкурс недоступен</h1>
        <p>${e.message}</p>
        <button class="btn secondary" style="margin-top:12px" onclick="renderAdmin()">В главное меню</button>
      </div>
    `);
    return;
  }

  const { contest, conditions, status, participant_id, assigned_place, prize_won } = data;
  const confirmed = status === "confirmed";

  let winBanner = "";
  if (confirmed) {
    if (prize_won) {
      winBanner = `
        <div class="card" style="background:linear-gradient(135deg, #e9fbf0, #d5f7e1);border:1px solid #a3edbe;text-align:center;padding:20px;margin-bottom:14px;">
          <div style="font-size:36px;margin-bottom:6px;">🎉 🏆 🎁</div>
          <h2 style="margin:0 0 6px;color:#15803d;font-size:18px;">Поздравляем! Вы победили!</h2>
          <p style="color:#166534;font-size:15px;margin:0 0 8px;">Все участники, выполнившие условия, гарантированно получают призы!</p>
          <div style="background:#ffffff;border-radius:12px;padding:12px;font-weight:700;color:var(--text);font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,0.05);">
            Ваш приз (${assigned_place || 1} место): <span style="color:var(--blue)">${prize_won}</span>
          </div>
          <p style="font-size:12.5px;color:#166534;margin-top:10px;">Организатор свяжется с вами в Telegram для вручения приза.</p>
        </div>
      `;
    } else {
      winBanner = `<div class="banner">${ICONS.party}<span>Вы успешно выполнили все условия и участвуете в розыгрыше! Каждый участник побеждает!</span></div>`;
    }
  }

  render(`
    <div class="hero">${ICONS.gift}<h1>${contest.title}</h1><p>${contest.description || ""}</p></div>
    ${winBanner}
    <h2>Условия участия</h2>
    <p style="margin-bottom:12px;font-size:13px;color:var(--muted)">Выполните все пункты чек-листа ниже для подтверждения победы:</p>
    <div id="conds"></div>
  `);

  const condsEl = document.getElementById("conds");
  conditions.forEach(c => {
    const el = document.createElement("div");
    el.className = "condition" + (c.status === "approved" ? " approved" : "");
    el.innerHTML = `
      <div class="cond-top">
        <div class="mark">${ICONS.check}</div>
        <div>
          <div class="cond-text">${c.description}</div>
          ${c.status === "awaiting_screenshot" ? `<div class="cond-hint">Скриншот на проверке организатором…</div>` : ""}
        </div>
      </div>
      ${c.link ? `<button class="btn link-btn" type="button">Выполнить ${ICONS.arrow}</button>` : ""}
    `;
    el.querySelector(".cond-top").onclick = async () => {
      if (c.status === "approved") return;
      try {
        const r = await api("check_condition", {
          method: "POST",
          body: { participant_id, condition_id: c.id },
        });
        if (r.condition_status === "approved") {
          el.classList.add("approved");
        } else if (r.condition_status === "awaiting_screenshot") {
          notify("Пришли скриншот прямо в чат с ботом — организатор проверит его и отметит.");
        } else if (r.condition_status === "not_subscribed") {
          notify("Не вижу подписки на канал — подпишись и нажми ещё раз.");
        }
        if (r.contest_confirmed) renderContest(ref);
      } catch (e) { notify("Ошибка: " + e.message); }
    };
    const linkBtn = el.querySelector(".link-btn");
    if (linkBtn) linkBtn.onclick = () => openLink(c.link);
    condsEl.appendChild(el);
  });
}

// ===== Экран оплаты подписки =====
async function renderPaywall(onPaid) {
  let status = { price_rub: 390 };
  try { status = await api("admin_status"); } catch(e) {}
  render(`
    <div class="card">
      <h1>Необходима подписка</h1>
      <p>Создание и проведение конкурсов доступно только по активной подписке организатора — ${status.price_rub || 390}₽ / 30 дней.</p>
      <button class="btn" id="pay-btn">Оплатить через CryptoBot (${status.price_rub || 390}₽)</button>
      <button class="btn secondary" style="margin-top:8px" onclick="renderAdmin()">Назад</button>
    </div>
  `);
  document.getElementById("pay-btn").onclick = async () => {
    const { pay_url, invoice_id } = await api("create_invoice", { method: "POST" });
    tg?.openTelegramLink ? tg.openTelegramLink(pay_url) : window.open(pay_url, "_blank");
    render(`<div class="card"><p>Ожидаем подтверждения оплаты в CryptoBot…</p></div>`);
    const poll = setInterval(async () => {
      const r = await api("check_payment", { method: "POST", body: { invoice_id } });
      if (r.paid) { clearInterval(poll); onPaid(); }
    }, 3000);
  };
}

// ===== Экран "Мои конкурсы" =====
async function renderAdmin() {
  render(`<div class="skeleton"></div><div class="skeleton"></div>`);
  let status;
  try { status = await api("admin_status"); }
  catch (e) { render(`<div class="card"><p>Ошибка: ${e.message}</p></div>`); return; }

  const list = await api("list_contests");
  render(`
    <h1>Мои конкурсы</h1>
    ${status.is_admin ? `<p>У тебя как у владельца бота — подписка не нужна.</p>` : ""}
    <div id="list"></div>
    <button class="btn" id="new-btn">+ Создать конкурс</button>
  `);
  const listEl = document.getElementById("list");
  if (list.contests.length === 0) {
    listEl.innerHTML = `<p>Пока нет ни одного конкурса.</p>`;
  }
  list.contests.forEach(c => {
    const el = document.createElement("div");
    el.className = "card list-item";
    const isDraft = c.status === "draft";
    const statusBadge = isDraft 
      ? `<span style="background:#fef3c7;color:#b45309;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;">Черновик</span>` 
      : `<span style="background:#e9fbf0;color:#15803d;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;">Активен</span>`;

    el.innerHTML = `
      <div style="flex:1;margin-right:12px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="title">${c.title}</div>
          ${statusBadge}
        </div>
        <div class="meta">${isDraft ? 'Не опубликован' : 'до ' + new Date(c.deadline_at).toLocaleString("ru-RU")}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        ${isDraft ? `<button class="btn publish-btn" style="padding:6px 12px;font-size:12px;width:auto;margin:0;" data-id="${c.id}">Опубликовать</button>` : `
          <a href="${c.ref_link}" class="muted-link" style="text-decoration:none;font-size:13px;">Открыть</a>
          <button class="muted-link copy-btn" data-link="${c.ref_link}" style="font-size:13px;">Копировать</button>
        `}
      </div>
    `;
    const copyBtn = el.querySelector(".copy-btn");
    if (copyBtn) {
      copyBtn.onclick = (e) => {
        navigator.clipboard.writeText(e.target.dataset.link);
        notify("Рабочая ссылка бота скопирована!");
      };
    }
    const pubBtn = el.querySelector(".publish-btn");
    if (pubBtn) {
      pubBtn.onclick = async () => {
        try {
          await api("publish_contest", { method: "POST", body: { contest_id: c.id } });
          notify("Конкурс успешно опубликован!");
          renderAdmin();
        } catch(err) {
          notify("Ошибка публикации: " + err.message);
        }
      };
    }
    listEl.appendChild(el);
  });

  document.getElementById("new-btn").onclick = () => {
    if (!status.subscribed) { renderPaywall(renderCreateForm); return; }
    renderCreateForm();
  };
}

function renderCreateForm() {
  render(`
    <h1>Новый конкурс</h1>
    <label>Название</label>
    <input id="f-title" placeholder="Например, Раздача iPhone 16">
    <label>Описание</label>
    <textarea id="f-desc" rows="3" placeholder="Что участникам нужно знать"></textarea>
    <label>Дедлайн</label>
    <input id="f-deadline" type="datetime-local">

    <h2>Призовые места</h2>
    <p style="margin-bottom:10px">⭐ Все участники, подтвердившие условия, гарантированно побеждают и получают призы!</p>
    <div id="places"></div>
    <button class="muted-link" id="add-place">+ Добавить место</button>

    <h2>Условия участия</h2>
    <div id="conditions"></div>
    <button class="muted-link" id="add-cond">+ Добавить условие</button>

    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn" id="submit-btn" style="flex:1;">🚀 Опубликовать</button>
      <button class="btn secondary" id="draft-btn" style="flex:1;margin-top:8px;">💾 В черновики</button>
    </div>
    <button class="btn secondary" style="margin-top:8px;" onclick="renderAdmin()">Отмена</button>
  `);

  const placesEl = document.getElementById("places");
  const condsEl = document.getElementById("conditions");

  function addPlaceRow(n = "") {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input class="p-num" type="number" placeholder="Место" value="${n}">
      <input class="p-prize" placeholder="Приз">
    `;
    placesEl.appendChild(row);
  }
  function addCondRow() {
    const row = document.createElement("div");
    row.className = "card";
    row.innerHTML = `
      <select class="c-type">
        <option value="auto_channel_sub">Подписка на канал (авто)</option>
        <option value="manual_screenshot">Скриншот (проверка вручную)</option>
      </select>
      <input class="c-channel" placeholder="ID канала (для авто), напр. -1001234567890">
      <input class="c-desc" placeholder="Текст условия для участника">
      <input class="c-link" placeholder="Ссылка на кнопку «Выполнить» (необязательно)">
    `;
    condsEl.appendChild(row);
  }
  addPlaceRow(1);
  addCondRow();
  document.getElementById("add-place").onclick = () => addPlaceRow();
  document.getElementById("add-cond").onclick = () => addCondRow();

  async function saveContest(isDraft = false) {
    const places = [...placesEl.children].map(r => ({
      place: parseInt(r.querySelector(".p-num").value || "1"),
      prize: r.querySelector(".p-prize").value,
    }));
    const conditions = [...condsEl.children].map(r => ({
      type: r.querySelector(".c-type").value,
      channel_id: r.querySelector(".c-channel").value ? parseInt(r.querySelector(".c-channel").value) : null,
      description: r.querySelector(".c-desc").value,
      link: r.querySelector(".c-link").value || null,
    }));
    const deadlineRaw = document.getElementById("f-deadline").value;
    try {
      const r = await api("create_contest", {
        method: "POST",
        body: {
          title: document.getElementById("f-title").value,
          description: document.getElementById("f-desc").value,
          deadline_at: deadlineRaw,
          is_draft: isDraft,
          places, conditions,
        },
      });
      if (isDraft) {
        render(`
          <div class="card">
            <h1>Сохранено в черновики 💾</h1>
            <p>Конкурс успешно сохранён! Он не виден участникам, пока вы не нажмёте «Опубликовать» в списке ваших конкурсов.</p>
            <button class="btn" style="margin-top:12px" onclick="renderAdmin()">Вернуться в список</button>
          </div>
        `);
      } else {
        render(`
          <div class="card">
            <h1>Готово ✅</h1>
            <p>Конкурс опубликован! Рабочая реферальная ссылка в бота для участников:</p>
            <p style="word-break:break-all;font-weight:600;color:var(--blue);margin:8px 0;">${r.ref_link}</p>
            <button class="btn" style="margin-top:12px" onclick="location.href='${r.ref_link}'">Открыть в боте</button>
            <button class="btn secondary" style="margin-top:8px" onclick="renderAdmin()">Вернуться в список</button>
          </div>
        `);
      }
    } catch (e) {
      if (e.message.includes("subscription")) { renderPaywall(() => renderCreateForm()); }
      else notify("Ошибка: " + e.message);
    }
  }

  document.getElementById("submit-btn").onclick = () => saveContest(false);
  document.getElementById("draft-btn").onclick = () => saveContest(true);
}

// ===== Точка входа =====
(function init() {
  // Support standard URL query param (?ref=...)
  let ref = params.get("ref");

  // Support Telegram Mini App direct link (?startapp=c_... or tg.initDataUnsafe.start_param)
  if (!ref) {
    const startAppParam = params.get("startapp") || params.get("tgWebAppStartParam") || tg?.initDataUnsafe?.start_param;
    if (startAppParam) {
      if (startAppParam.startsWith("c_")) ref = startAppParam.slice(2);
      else if (startAppParam.startsWith("ref_")) ref = startAppParam.slice(4);
      else ref = startAppParam;
    }
  }

  // If ref is present or user is not explicitly admin via url, show contest
  if (ref) {
    renderContest(ref);
  } else if (params.get("admin") === "1") {
    renderAdmin();
  } else {
    // If opened directly without ref and not admin mode, also show contests list or admin
    renderAdmin();
  }
})();
</script>
</body>
